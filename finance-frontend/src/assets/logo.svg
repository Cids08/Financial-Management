<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching original image subtle lighting -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e2e3e7"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg-glow)"/>

  <g transform="translate(0, 0)">
    <!-- ================= LOGO MARK ================= -->
    <g fill="#1a1818">
      <!-- Outer 'A' Structure Left Leg -->
      <path d="M 235 83 
               L 155 281 
               L 204 281 
               L 221 239 
               C 228 221, 239 204, 250 188 
               L 235 83 Z" />

      <!-- Outer 'A' Structure Right Leg -->
      <path d="M 265 83 
               L 250 188 
               C 261 204, 272 221, 279 239 
               L 296 281 
               L 345 281 
               L 265 83 Z" />

      <!-- Inner 'A' Triangle / Apex -->
      <polygon points="250,220 228,281 272,281" />

      <!-- Curved Swoosh / Arc -->
      <!-- Sweeps dynamically across the 'A' with sharp tapered ends -->
      <path d="M 120 267 
               C 175 210, 248 181, 325 183 
               C 348 184, 357 190, 360 212 
               C 362 232, 358 249, 355 268 
               C 353 234, 340 205, 305 201 
               C 240 193, 178 221, 120 267 Z" />
    </g>

    <!-- ================= TYPOGRAPHY ================= -->
    <g fill="#1a1818" text-anchor="middle">
      <!-- Main Brand Name: ALIBATON -->
      <text x="250" y="328" 
            font-family="Montserrat, 'Arial Black', 'Helvetica Neue', sans-serif" 
            font-weight="900" 
            font-size="37" 
            letter-spacing="1.5">ALIBATON</text>

      <!-- Sub-headline Line 1: CONSTRUCTION -->
      <text x="250" y="370" 
            font-family="'Montserrat Light', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="300" 
            font-size="20.5" 
            letter-spacing="6.2">CONSTRUCTION</text>

      <!-- Sub-headline Line 2: INCORPORATED -->
      <text x="250" y="403" 
            font-family="'Montserrat Light', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="300" 
            font-size="20.5" 
            letter-spacing="6.1">INCORPORATED</text>
    </g>
  </g>
</svg>
