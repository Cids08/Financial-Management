<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMS Microservices Architecture Diagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
    }
    .toolbar {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    .btn-download {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      transition: background 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-download:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .btn-download:active {
      transform: translateY(0);
    }
    .canvas-card {
      background: #ffffff;
      padding: 25px 25px 35px 25px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 1140px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Toolbar with 1-Click Download Button -->

        <polyline points="7 10 12 15 17 10"></polyline>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script>
    function downloadPNG() {
      const svg = document.getElementById('architectureSvg');
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');

      // Ultra-HD scale (2.5x)
      const scale = 2.5;
      const width = 1240 * scale;
      const height = 680 * scale;

      canvas.width = width;
      canvas.height = height;

      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = 'fms_system_architecture.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      img.src = blobURL;
    }
  </script>
